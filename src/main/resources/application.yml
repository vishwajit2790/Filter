server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/logistics_db
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: your_mailtrap_username
    password: your_mailtrap_password

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info